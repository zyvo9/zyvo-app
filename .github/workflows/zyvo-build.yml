name: Zyvo Termux Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fetch zyvo engine
        run: |
          set -euo pipefail
          VER="1.17.9"
          BASE="https://github.com/zyvo9/ZYVO-AI/releases/download/android-v${VER}"
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64 app/src/main/assets
          for ARCH in aarch64 x86_64; do
            if [ "$ARCH" = "aarch64" ]; then ABI="arm64-v8a"; else ABI="x86_64"; fi
            curl -fsSL -o "engine-${ARCH}.zip" "$BASE/zyvo-${VER}-android-${ARCH}.zip"
            unzip -q "engine-${ARCH}.zip" -d "ext-${ARCH}"
            U="ext-${ARCH}/data/data/com.termux/files/usr"
            cp "$U/libexec/zyvo/zyvo.bin" "app/src/main/jniLibs/${ABI}/libzyvo.so"
            for f in "$U"/lib/*.so; do cp "$f" "app/src/main/jniLibs/${ABI}/"; done
            chmod 755 "app/src/main/jniLibs/${ABI}/libzyvo.so"
            echo "== jniLibs/${ABI} =="
            ls -la "app/src/main/jniLibs/${ABI}/"
            rm -rf "ext-${ARCH}" "engine-${ARCH}.zip"
          done
          curl -fsSL -o app/src/main/assets/skills.tar.gz "$BASE/skills.tar.gz"
          ls -la app/src/main/assets/

      - name: Build APK
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
        run: >-
          ./gradlew assembleDebug --no-daemon
          -PzyvoOpencodeKey="${{ secrets.ZYVO_OPENCODE_KEY }}"
          -PzyvoGatewayKey="${{ secrets.ZYVO_GATEWAY_KEY }}"
          -PzyvoBuild="${{ github.run_number }}"

      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" --title "$tag" \
            --notes "Zyvo Termux trial build ${GITHUB_SHA:0:7}" || true
          ls -la app/build/outputs/apk/debug/
          gh release upload "$tag" app/build/outputs/apk/debug/*arm64-v8a*.apk --clobber
          gh release upload "$tag" app/build/outputs/apk/debug/*x86_64*.apk --clobber
          gh release upload "$tag" app/build/outputs/apk/debug/*universal*.apk --clobber
